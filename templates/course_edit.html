<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Editar {{ course.title }}</title>
  </head>
  <body>
    <h1>Editar curso: {{ course.title }}</h1>
    <form method="post" action="">
      {% csrf_token %}
      <p>
        <label for="title">Título</label><br>
        <input id="title" name="title" value="{{ course.title }}" required>
      </p>
      <p>
        <label for="description">Descripción</label><br>
        <textarea id="description" name="description" rows="6" cols="60">{{ course.description }}</textarea>
      </p>
      <p>
        <label><input type="checkbox" name="is_published" {% if course.is_published %}checked{% endif %}> Publicado</label>
      </p>
      <p>
        <button type="submit">Guardar cambios</button>
        <a href="{% url 'course-detail-page' pk=course.pk %}">Cancelar</a>
      </p>
    </form>
  </body>
</html>
